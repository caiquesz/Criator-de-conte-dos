<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      :root {
        --texto: #FFFFFF;
        --destaque: #E8B880;
        --destaque-brilho: #E8B88059;
        --vazamento: #FF9A4D;
      }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .transicao { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      .transicao.luz { mix-blend-mode: screen; }
      .vazamento { position: absolute; inset: -25%; opacity: 0; }
      .vazamento.ambar {
        background: radial-gradient(ellipse 50% 95% at 18% 55%, rgba(255, 244, 214, 0.95), transparent 46%),
                    radial-gradient(ellipse 75% 120% at 28% 50%, var(--vazamento), transparent 68%);
        filter: blur(30px);
      }
      .vazamento.quente {
        background: radial-gradient(ellipse 60% 100% at 78% 35%, rgba(255, 92, 60, 0.75), rgba(255, 60, 90, 0.25) 50%, transparent 76%);
        filter: blur(40px);
      }
      .vazamento.clarao { background: radial-gradient(ellipse 90% 80% at 50% 45%, rgba(255, 248, 232, 1), rgba(255, 214, 160, 0.85) 55%, rgba(255, 170, 110, 0.6)); }
      .cortina { position: absolute; inset: 0; background: #000; opacity: 0; }
      .cortina.branca { background: #fff8ee; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.55"
      data-width="1080" data-height="1920">
      <div class="cam" id="cam-video" style="z-index: 1">
        <video id="video" class="clip" src="assets/video/broll_teste.mp4" data-start="0" data-duration="5.55"
          data-track-index="0" muted playsinline></video>
      </div>

      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html"
        data-start="0" data-duration="5.55" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html"
        data-start="0" data-duration="5.55" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>

      <div id="tr1" class="clip transicao luz" data-start="2.61" data-duration="0.8" data-track-index="5" data-layout-ignore>
        <div class="vazamento ambar" id="tr1-a"></div>
        <div class="vazamento quente" id="tr1-b"></div>
        <div class="vazamento clarao" id="tr1-c"></div>
      </div>

      <audio id="sfx1" src="assets/sfx/click.mp3" data-start="0.26" data-duration="0.366" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx2" src="assets/sfx/click-agudo.mp3" data-start="1.721" data-duration="0.34" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx3" src="assets/sfx/whoosh-transicao.mp3" data-start="2.16" data-duration="1.944" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx4" src="assets/sfx/click-agudo.mp3" data-start="3.221" data-duration="0.34" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx5" src="assets/sfx/click-agudo.mp3" data-start="3.921" data-duration="0.34" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx6" src="assets/sfx/whoosh-rapido.mp3" data-start="4.223" data-duration="0.549" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx7" src="assets/sfx/click.mp3" data-start="4.51" data-duration="0.366" data-track-index="11" data-volume="0.55"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 5.55 }, 0);
      tl.fromTo("#tr1-a", {opacity:0, xPercent:-30, rotation:-6}, {opacity:1, xPercent:10, rotation:2, duration:0.42, ease:"sine.out"}, 2.61);
      tl.to("#tr1-a", {opacity:0, xPercent:30, duration:0.36, ease:"sine.in"}, 3.03);
      tl.fromTo("#tr1-b", {opacity:0, xPercent:25, yPercent:-8}, {opacity:0.9, xPercent:-5, yPercent:4, duration:0.36, ease:"sine.out"}, 2.67);
      tl.to("#tr1-b", {opacity:0, xPercent:-25, duration:0.38, ease:"sine.in"}, 3.03);
      tl.fromTo("#tr1-c", {opacity:0}, {opacity:0.92, duration:0.1, ease:"power2.in"}, 2.83);
      tl.to("#tr1-c", {opacity:0, duration:0.3, ease:"power2.out"}, 2.95);
      tl.fromTo(".cam", {scale:1.09}, {scale:1, duration:0.6, ease:"expo.out"}, 2.93);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
