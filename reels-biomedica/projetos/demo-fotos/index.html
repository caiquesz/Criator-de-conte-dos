<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      :root {
        --texto: #FFFFFF;
        --destaque: #FFFFFF;
        --destaque-brilho: transparent;
        --destaque-sombra: rgba(56, 46, 46, 0.42);
        --destaque-sombra-leve: rgba(56, 46, 46, 0.22);
        --destaque-escuro: #FFFFFF;
        --vazamento: #FF9A4D;
      }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .transicao { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
      .transicao.luz { mix-blend-mode: screen; }
      .vazamento { position: absolute; inset: -25%; opacity: 0; }
      .vazamento.ambar {
        background: radial-gradient(ellipse 50% 95% at 18% 55%, rgba(255, 244, 214, 0.95), transparent 46%),
                    radial-gradient(ellipse 75% 120% at 28% 50%, var(--vazamento), transparent 68%);
        filter: blur(30px);
      }
      .vazamento.quente {
        background: radial-gradient(ellipse 60% 100% at 78% 35%, rgba(255, 92, 60, 0.75), rgba(255, 60, 90, 0.25) 50%, transparent 76%);
        filter: blur(40px);
      }
      .vazamento.clarao { background: radial-gradient(ellipse 90% 80% at 50% 45%, rgba(255, 248, 232, 1), rgba(255, 214, 160, 0.85) 55%, rgba(255, 170, 110, 0.6)); }
      .cortina { position: absolute; inset: 0; background: #000; opacity: 0; }
      .cortina.branca { background: #fff8ee; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.1"
      data-width="1080" data-height="1920">
      <div class="cam" id="cam-video" style="z-index: 1">
        <video id="video" class="clip" src="assets/video/video.mp4" data-start="0" data-duration="24.1"
          data-track-index="0" data-has-audio="true" playsinline></video>
      </div>

      <div id="fotos-fundo" data-composition-id="fotos-fundo" data-composition-src="compositions/fotos-fundo.html"
        data-start="0" data-duration="24.1" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html"
        data-start="0" data-duration="24.1" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 7"></div>

      <div class="cam" id="cam-recorte" style="z-index: 4">
        <video id="recorte1" class="clip" src="assets/video/recorte.webm" data-start="12.4" data-media-start="12.4"
          data-duration="3.2" data-track-index="1" muted playsinline data-layout-allow-occlusion></video>
      </div>
      <div id="fotos" data-composition-id="fotos" data-composition-src="compositions/fotos.html"
        data-start="0" data-duration="24.1" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html"
        data-start="0" data-duration="24.1" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

      

      <audio id="sfx1" src="assets/sfx/click.mp3" data-start="0.376" data-duration="0.366" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx2" src="assets/sfx/click-agudo.mp3" data-start="1.011" data-duration="0.34" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx3" src="assets/sfx/click-agudo.mp3" data-start="3.271" data-duration="0.34" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx4" src="assets/sfx/click-agudo.mp3" data-start="5.291" data-duration="0.34" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx5" src="assets/sfx/click-agudo.mp3" data-start="6.831" data-duration="0.34" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx6" src="assets/sfx/whoosh-rapido.mp3" data-start="6.833" data-duration="0.549" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx7" src="assets/sfx/click.mp3" data-start="7.37" data-duration="0.366" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx8" src="assets/sfx/whoosh.mp3" data-start="9.921" data-duration="0.575" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx9" src="assets/sfx/whoosh-rapido.mp3" data-start="12.393" data-duration="0.549" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx10" src="assets/sfx/click-agudo.mp3" data-start="12.771" data-duration="0.34" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx11" src="assets/sfx/whoosh.mp3" data-start="15.471" data-duration="0.575" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx12" src="assets/sfx/click.mp3" data-start="17.82" data-duration="0.366" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx13" src="assets/sfx/whoosh-rapido.mp3" data-start="20.313" data-duration="0.549" data-track-index="10" data-volume="0.5"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 24.1 }, 0);
      tl.fromTo(".cam", {scale:1.045}, {scale:1, duration:0.45, ease:"expo.out", immediateRender:false}, 6.367);
      tl.fromTo(".cam", {y:0}, {y:385, duration:0.5, ease:"expo.out", immediateRender:false}, 10);
      tl.fromTo(".cam", {y:385}, {y:0, duration:0.42, ease:"expo.in", immediateRender:false}, 11.96);
      tl.fromTo(".cam", {y:0}, {y:377, duration:0.5, ease:"expo.out", immediateRender:false}, 15.55);
      tl.fromTo(".cam", {y:377}, {y:0, duration:0.42, ease:"expo.in", immediateRender:false}, 19.91);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
