<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Oblisk"; src: url("assets/OBLISK.otf"); }
@font-face { font-family: "Poppins"; font-weight: 400; src: url("assets/Poppins-Regular.ttf"); }
@font-face { font-family: "Poppins"; font-weight: 500; src: url("assets/Poppins-Medium.ttf"); }
@font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/Poppins-SemiBold.ttf"); }
@font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/Poppins-Bold.ttf"); }
:root { --cream: #F5EEE2; --red: #FF5148; }
html, body { margin: 0; padding: 0; background: transparent; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity, filter; }

/* ---------- painel do motion ---------- */
#panel { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070707; }
#bg { position: absolute; left: 50%; top: 50%; width: 1287px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
#vig { position: absolute; inset: 0;
  background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 70%, rgba(0,0,0,.75) 100%); }

/* ---------- tipografia ---------- */
.obl { font-family: "Oblisk"; color: var(--cream); text-transform: uppercase; line-height: .714; white-space: nowrap;
  letter-spacing: .01em; }
.sm { font-family: "Poppins"; font-weight: 500; color: rgba(245,238,226,.86); white-space: nowrap; letter-spacing: -.01em; }
.w { display: inline-block; }

/* legenda constante */
.phrase { position: absolute; left: 0; width: 1080px; text-align: center; }
.phrase .l1 { font-family: "Poppins"; font-weight: 500; font-size: 54px; line-height: 1.15; color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.55), 0 0 3px rgba(0,0,0,.35); white-space: nowrap; letter-spacing: -.01em; }
.phrase .l1 .w { margin: 0 .13em; }
.phrase .l2 { font-family: "Oblisk"; font-size: 230px; line-height: .714; color: var(--cream); text-transform: uppercase;
  text-shadow: 0 8px 30px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.35); white-space: nowrap; margin-top: 26px; letter-spacing: .012em; }
.phrase .l2 .w { margin: 0 .07em; }

/* card CNH */
.card { width: 640px; height: 400px; border-radius: 30px; box-sizing: border-box;
  border: 3px solid rgba(245,238,226,.9);
  background: linear-gradient(150deg, rgba(255,255,255,.13), rgba(255,255,255,.03) 60%, rgba(255,255,255,.07));
  box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25); overflow: hidden; }
.card .top { height: 92px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px;
  border-bottom: 2px solid rgba(245,238,226,.35); }
.card .top .t { font-family: "Poppins"; font-weight: 600; font-size: 17px; letter-spacing: .16em; color: rgba(245,238,226,.8); line-height: 1.35; }
.card .top .cnh { font-family: "Oblisk"; font-size: 74px; line-height: .714; color: var(--cream); letter-spacing: .03em; }
.card .body { display: flex; padding: 30px 34px; gap: 34px; }
.card .photo { width: 150px; height: 220px; border-radius: 16px; background: rgba(245,238,226,.12); position: relative; overflow: hidden;
  border: 2px solid rgba(245,238,226,.25); }
.card .photo .head { position: absolute; left: 50%; top: 46px; width: 72px; height: 72px; margin-left: -36px; border-radius: 50%; background: rgba(245,238,226,.55); }
.card .photo .sh { position: absolute; left: 50%; top: 132px; width: 128px; height: 120px; margin-left: -64px; border-radius: 64px 64px 0 0; background: rgba(245,238,226,.55); }
.card .fields { flex: 1; }
.card .lbl { font-family: "Poppins"; font-weight: 600; font-size: 16px; letter-spacing: .14em; color: rgba(245,238,226,.6); margin-bottom: 9px; }
.card .bar { height: 16px; border-radius: 8px; background: rgba(245,238,226,.35); margin-bottom: 22px; }
.card .val { position: relative; display: inline-block; font-family: "Poppins"; font-weight: 700; font-size: 34px; color: var(--cream);
  padding: 4px 14px; margin-left: -14px; border-radius: 10px; }
.card .val .hlbox { position: absolute; inset: 0; border-radius: 10px; border: 3px solid var(--cream); transform-origin: 0 50%; }

.stamp { font-family: "Oblisk"; font-size: 132px; line-height: .714; color: var(--red); border: 9px solid var(--red);
  padding: 22px 26px 22px 30px; border-radius: 14px; letter-spacing: .04em; text-transform: uppercase;
  box-shadow: 0 10px 40px rgba(0,0,0,.4); background: rgba(10,10,10,.25); }

.track { width: 760px; height: 16px; border-radius: 8px; background: rgba(245,238,226,.16); position: relative; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: var(--cream); }
.track .knob { position: absolute; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
  background: var(--cream); box-shadow: 0 0 0 10px rgba(245,238,226,.18), 0 0 30px rgba(245,238,226,.5); }
.tlabels { width: 760px; display: flex; justify-content: space-between; font-family: "Poppins"; font-weight: 600;
  font-size: 30px; letter-spacing: .08em; color: rgba(245,238,226,.7); }
/* título de abertura */
#introDim { position: absolute; inset: 0; background:
  radial-gradient(ellipse 80% 55% at 50% 50%, rgba(0,0,0,.52) 0%, rgba(0,0,0,.62) 100%); opacity: 0; }
#intro .obl, #intro .sm { text-shadow: 0 8px 30px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.35); }
#intro .sm { color: #fff; }
.hdr { background: rgba(12,12,12,.92); border-radius: 26px; padding: 30px 44px 28px; text-align: center;
  box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 2px rgba(245,238,226,.10); }
.hdr .obl { font-size: 100px; line-height: .714; }
.hdr .obl + .obl { margin-top: 20px; }
.red { color: var(--red); }
.uline { height: 10px; border-radius: 5px; background: var(--cream); transform-origin: 50% 50%; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="hblur" x="-10%" y="0%" width="120%" height="100%"><feGaussianBlur id="hblurG" stdDeviation="0 0"/></filter>
</svg>
<div id="stage">
  <div id="panel" style="display:none">
    <img id="bg" src="assets/fundo_motion.jpg">
    <div id="vig"></div>
    <div id="scene"></div>
  </div>
  <div id="introDim"></div>
  <div id="caps"></div>
  <div id="intro"></div>
</div>
<script src="timeline.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = p => 1 - Math.pow(1 - clamp(p), 3);                 // easeOutCubic
const ei = p => Math.pow(clamp(p), 3);                         // easeInCubic
const eio = p => { p = clamp(p); return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; };
const eback = p => { p = clamp(p); const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(p - 1, 3) + c1*Math.pow(p - 1, 2); };
const W = i => TL.words[i].s;

/* ---------- animações de entrada/saída ---------- */
const IN = {
  up:    p => ({ o: eo(p*1.3), dy: (1 - eo(p)) * 30, b: (1 - eo(p)) * 12 }),
  pop:   p => ({ o: clamp(p*3), s: .55 + .45*eback(p), b: (1 - eo(p*1.4)) * 16 }),
  slam:  p => ({ o: clamp(p*4), s: 1 + .9*(1 - eo(p)), b: (1 - eo(p)) * 8 }),
  right: p => ({ o: eo(p*1.3), dx: (1 - eo(p)) * 140, b: (1 - eo(p)) * 12 }),
  rise:  p => ({ o: eo(p*1.5), dy: (1 - eo(p)) * 320, s: .92 + .08*eo(p), b: (1 - eo(p)) * 10 }),
  fade:  p => ({ o: eo(p) }),
  drop:  p => ({ o: eo(p*1.4), dy: -(1 - eo(p)) * 60, s: .9 + .1*eback(p), b: (1 - eo(p)) * 12 }),
};
const OUT = {
  out:   q => ({ o: 1 - eo(q), s: 1 + .14*ei(q), b: eo(q) * 16 }),
  up:    q => ({ o: 1 - eo(q), dy: -ei(q) * 160, b: eo(q) * 12 }),
  left:  q => ({ o: 1 - eo(q), dx: -ei(q) * 260, b: eo(q) * 14 }),
  down:  q => ({ o: 1 - eo(q), s: 1 - .18*ei(q), b: eo(q) * 12 }),
  // encolhe e sobe até a posição do cabeçalho (sensação de "morph" para o topo)
  toTop: (q, it) => ({ o: 1 - clamp((q - .35) / .5), dy: -eo(q) * (it.y - (it.toY || 380)), s: 1 - (1 - (it.toS || .3)) * eo(q), b: eo(q) * 5 }),
};
const items = [];
const introItems = [];
let TARGET = items;
function el(html, parent, cls) {
  const d = document.createElement('div');
  d.className = 'abs ' + (cls || '');
  d.innerHTML = html;
  (parent || document.getElementById('scene')).appendChild(d);
  return d;
}
/* item absoluto centrado em (x,y) */
function A(node, x, y, tin, inType, tout, outType, opt = {}) {
  const it = Object.assign({ node, x, y, tin, inType, tout, outType, inD: inType === 'pop' ? .36 : (inType === 'slam' ? .2 : .32),
    outD: .24, rot: 0, drift: .03, abs: true }, opt);
  TARGET.push(it); return it;
}
/* linha de palavras (cada palavra entra no seu tempo) */
function line(wordsArr, x, y, cls, size, tout, outType, opt = {}) {
  const d = el('', opt.parent || null, cls);
  d.style.fontSize = size + 'px';
  const box = A(d, x, y, -1, 'none', tout, outType, Object.assign({ drift: 0 }, opt));
  wordsArr.forEach(([txt, t, type, extra]) => {
    const s = document.createElement('span');
    s.className = 'w' + (extra && extra.cls ? ' ' + extra.cls : '');
    s.textContent = txt;
    s.style.margin = '0 ' + (cls.includes('obl') ? '.05em' : '.12em');
    if (extra && extra.style) Object.assign(s.style, extra.style);
    d.appendChild(s);
    TARGET.push({ node: s, tin: t, inType: type || 'up', inD: type === 'pop' ? .36 : .3, tout: 1e9, abs: false, drift: 0 });
  });
  return box;
}
function stateOf(it, t) {
  let st = { o: 1, dx: 0, dy: 0, s: 1, b: 0 };
  if (it.inType !== 'none') {
    if (t < it.tin) return { o: 0, dx: 0, dy: 0, s: 1, b: 0 };
    const p = (t - it.tin) / it.inD;
    if (p < 1) Object.assign(st, IN[it.inType](p));
  }
  if (t >= it.tout) {
    const q = (t - it.tout) / it.outD;
    if (q >= 1) return { o: 0, dx: 0, dy: 0, s: 1, b: 0 };
    const o2 = OUT[it.outType](q, it);
    st.o *= (o2.o ?? 1); st.dx += (o2.dx || 0); st.dy += (o2.dy || 0); st.s *= (o2.s ?? 1); st.b += (o2.b || 0);
  }
  if (it.drift && t > it.tin) st.s *= 1 + it.drift * clamp((t - it.tin) / Math.max(.5, it.tout - it.tin));
  return st;
}
function apply(it, st) {
  const n = it.node;
  if (st.o <= 0.001) { if (it.abs) n.style.display = 'none'; else n.style.visibility = 'hidden'; return; }
  if (it.abs) n.style.display = 'block'; else n.style.visibility = 'visible';
  n.style.opacity = st.o.toFixed(3);
  const tr = it.abs
    ? `translate(${it.x}px, ${it.y}px) translate(-50%, -50%) translate(${st.dx.toFixed(2)}px, ${st.dy.toFixed(2)}px) scale(${st.s.toFixed(4)}) rotate(${it.rot}deg)`
    : `translate(${st.dx.toFixed(2)}px, ${st.dy.toFixed(2)}px) scale(${st.s.toFixed(4)})`;
  n.style.transform = tr;
  n.style.filter = st.b > .05 ? `blur(${st.b.toFixed(2)}px)` : 'none';
}

/* ================= CENAS DO MOTION ================= */
const OB = (txt, size, extraStyle = '') => `<div class="obl" style="font-size:${size}px;${extraStyle}">${txt}</div>`;
function cardHTML(withStamp) {
  return `<div class="card">
    <div class="top"><div class="t">CARTEIRA NACIONAL<br>DE HABILITAÇÃO</div><div class="cnh">CNH</div></div>
    <div class="body">
      <div class="photo"><div class="head"></div><div class="sh"></div></div>
      <div class="fields">
        <div class="lbl">NOME</div><div class="bar" style="width:92%"></div>
        <div class="lbl">Nº REGISTRO</div><div class="bar" style="width:64%"></div>
        <div class="lbl">VALIDADE</div><div class="val"><span class="hlbox"></span><span class="vtxt">10 ANOS</span></div>
      </div>
    </div></div>`;
}
let counterNode, hlBox, fillNode, knobNode, ulineNode, ulineIt;
function buildScenes() {
  // ---- Cena 1: "há mais de 30 dias" ----
  const s1out = 9.84;
  line([['há', W(19)], ['mais', W(20)], ['de', W(21)]], 540, 620, 'sm', 62, s1out, 'out');
  A(el(OB('30', 600)), 540, 960, W(22), 'pop', s1out, 'out', { drift: .04 });
  A(el(OB('DIAS', 220)), 540, 1330, W(23), 'up', s1out, 'out');

  // ---- Cena 2: carteira tem prazo de validade ----
  const s2out = 12.22;
  A(el(OB('A CARTEIRA', 170)), 540, 470, W(25), 'pop', s2out, 'left', { drift: .02 });
  const c2 = el(cardHTML(false));
  A(c2, 540, 860, 10.15, 'rise', s2out, 'left', { inD: .45, drift: .025, rot: -2 });
  hlBox = c2.querySelector('.hlbox');
  line([['ela', W(26)], ['tem', W(27)], ['um', W(28)], ['prazo', W(29)], ['de', W(30)]], 540, 1175, 'sm', 58, s2out, 'left');
  A(el(OB('VALIDADE', 214)), 540, 1345, W(31), 'pop', s2out, 'left');

  // ---- Cena 3: hoje passou para 10 anos ----
  const s3out = 13.98;
  line([['hoje', W(32)], ['passou', W(33)], ['para', W(34)]], 540, 600, 'sm', 62, s3out, 'down');
  const cn = el(OB('1', 640));
  counterNode = cn.firstChild;
  A(cn, 540, 950, 12.76, 'fade', s3out, 'down', { inD: .08, drift: .05 });
  A(el(OB('ANOS', 230)), 540, 1320, W(36), 'up', s3out, 'down');
  const ul = el('<div class="uline" style="width:420px"></div>');
  ulineNode = ul.firstChild;
  ulineIt = A(ul, 540, 1450, W(36) + .12, 'fade', s3out, 'down', { inD: .05, drift: 0 });

  // ---- Cena 4a: e venceu? ----
  const s4a = W(39) - .05;
  line([['e', W(37), 'up']], 540, 395, 'sm', 62, s4a, 'up');
  A(el(OB('VENCEU?', 240)), 540, 560, W(38), 'pop', s4a, 'up', { drift: .03 });
  const c4 = el(cardHTML(true));
  A(c4, 540, 1000, W(37) + .25, 'rise', s4a, 'up', { inD: .45, drift: .02, rot: 2 });
  A(el('<div class="stamp">VENCIDA</div>'), 600, 1010, W(38) + .22, 'slam', s4a, 'up', { rot: -11, drift: 0 });

  // ---- Cena 4b: você tem mais 30 dias para andar com ela vencida ----
  const s4b = W(49) - .06;
  line([['você', W(39)], ['tem', W(40)], ['mais', W(41)]], 540, 560, 'sm', 62, s4b, 'out');
  line([['30', W(42), 'pop'], ['DIAS', W(43), 'right']], 540, 800, 'obl', 300, s4b, 'out');
  const lab = el('<div class="tlabels"><span>DIA 1</span><span>DIA 30</span></div>');
  A(lab, 540, 1015, W(43) + .12, 'up', s4b, 'out', { drift: 0 });
  const tr = el('<div class="track"><div class="fill"></div><div class="knob"></div></div>');
  fillNode = tr.querySelector('.fill'); knobNode = tr.querySelector('.knob');
  A(tr, 540, 1075, W(43) + .12, 'up', s4b, 'out', { drift: 0 });
  line([['para', W(44)], ['andar', W(45)], ['com', W(46)], ['ela', W(47)]], 540, 1215, 'sm', 58, s4b, 'out');
  A(el(OB('VENCIDA', 214, 'color:var(--red)')), 540, 1385, W(48), 'pop', s4b, 'out');
}

/* ================= TÍTULO DE ABERTURA ================= */
function buildIntro() {
  TARGET = introItems;
  const P = document.getElementById('intro');
  const M = TL.intro.morph;
  // grande no centro, sincronizado com "quando que ela pode ser recolhida?"
  line([['quando', -.15], ['a', W(1)], ['sua', W(1) + .05]], 540, 742, 'sm', 62, M, 'toTop', { parent: P, toY: 335, toS: .5, outD: .4 });
  A(el(OB('CNH', 440), P), 540, 955, W(2), 'pop', M, 'toTop', { toY: 335, toS: .23, outD: .4, drift: .03 });
  line([['PODE', W(3)], ['SER', W(4)], ['RECOLHIDA?', W(5), 'pop', { cls: 'red' }]], 540, 1205, 'obl', 158, M, 'toTop',
       { parent: P, toY: 427, toS: .63, outD: .4 });
  // vira cabeçalho fixo no topo até o motion entrar
  const h = el(`<div class="hdr">${OB('QUANDO A SUA CNH', 100)}${OB('PODE SER <span class="red">RECOLHIDA?</span>', 100)}</div>`, P);
  A(h, 540, 380, M + .16, 'drop', TL.intro.hdrOut, 'up', { inD: .38, drift: 0 });
  TARGET = items;
}

/* ================= LEGENDA CONSTANTE ================= */
const CAP_Y = 1105;   // centro da linha pequena
const phraseIts = [];
function buildCaptions() {
  const caps = document.getElementById('caps');
  TL.phrases.forEach(p => {
    if (p.hidden) return;
    const d = document.createElement('div');
    d.className = 'phrase';
    const l1 = document.createElement('div'); l1.className = 'l1';
    const l2 = document.createElement('div'); l2.className = 'l2';
    const ws = [];
    p.words.forEach(w => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.t;
      (w.hl ? l2 : l1).appendChild(s);
      ws.push({ node: s, tin: w.s - .05, inType: w.hl ? 'pop' : 'up', inD: w.hl ? .34 : .3, tout: 1e9, abs: false, drift: 0 });
    });
    if (l1.childNodes.length) d.appendChild(l1);
    if (l2.childNodes.length) d.appendChild(l2);
    caps.appendChild(d);
    // ajusta destaque largo
    if (l2.childNodes.length) {
      const wpx = l2.scrollWidth;
      if (wpx > 900) l2.style.fontSize = (230 * 900 / wpx) + 'px';
    }
    // linha pequena fica centrada em CAP_Y; se não há linha pequena, destaque centra ali
    const l1h = l1.childNodes.length ? l1.offsetHeight : 0;
    d.style.top = (CAP_Y - (l1h ? l1h / 2 : 0)) + 'px';
    phraseIts.push({ box: d, p, ws });
  });
}
function renderCaptions(t) {
  phraseIts.forEach(({ box, p, ws }) => {
    if (t < p.start - .01 || t > p.end + .3) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    // saída da frase
    let o = 1, b = 0, dy = 0;
    if (t >= p.end) { const q = clamp((t - p.end) / .2); o = 1 - eo(q); b = q * 10; dy = -ei(q) * 18; }
    box.style.opacity = o.toFixed(3);
    box.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none';
    box.style.transform = `translateY(${dy.toFixed(2)}px)`;
    ws.forEach(it => apply(it, stateOf(it, t)));
  });
}

/* ================= RENDER ================= */
function render(f) {
  const t = f / TL.fps;
  const px = TL.panelX[f];
  const panel = document.getElementById('panel');
  if (px >= 1079.9) { panel.style.display = 'none'; }
  else {
    panel.style.display = 'block';
    panel.style.transform = `translateX(${px.toFixed(2)}px)`;
    const sp = TL.speed[f];
    document.getElementById('hblurG').setAttribute('stdDeviation', `${(sp * .35).toFixed(2)} 0`);
    panel.style.filter = sp > 1 ? 'url(#hblur)' : 'none';
    // ken burns no fundo
    const kp = clamp((t - TL.tin[0]) / (TL.tout[1] - TL.tin[0]));
    const bg = document.getElementById('bg');
    bg.style.transform = `translate(-50%, -50%) translate(${(-20 + 40 * kp).toFixed(2)}px, ${(10 - 30 * kp).toFixed(2)}px) scale(${(1.04 + .08 * kp).toFixed(4)})`;
    items.forEach(it => apply(it, stateOf(it, t)));
    // contador 1 -> 10
    const c = clamp((t - 12.76) / (13.10 - 12.76));
    counterNode.textContent = String(Math.max(1, Math.min(10, Math.floor(1 + c * 9 + 1e-6))));
    // destaque do campo validade
    const hp = clamp((t - W(31)) / .3);
    hlBox.style.transform = `scaleX(${eo(hp).toFixed(3)})`; hlBox.style.opacity = hp > 0 ? 1 : 0;
    // sublinhado de ANOS
    const up = clamp((t - (W(36) + .12)) / .5);
    ulineNode.style.transform = `scaleX(${eo(up).toFixed(3)})`;
    // barra 1 -> 30 dias
    const bp = eio((t - (W(43) + .25)) / (W(48) + .3 - (W(43) + .25)));
    fillNode.style.width = (bp * 100).toFixed(2) + '%';
    knobNode.style.left = (bp * 100).toFixed(2) + '%';
  }
  // título de abertura + escurecimento do vídeo atrás dele
  introItems.forEach(it => apply(it, stateOf(it, t)));
  const M = TL.intro.morph;
  document.getElementById('introDim').style.opacity = (t < M ? 1 : 1 - eo((t - M) / .4)).toFixed(3);
  renderCaptions(t);
}
window.__ready = (async () => {
  await document.fonts.load('100px Oblisk');
  await document.fonts.load('500 50px Poppins');
  await document.fonts.load('600 50px Poppins');
  await document.fonts.load('700 50px Poppins');
  await document.fonts.ready;
  await new Promise(r => { const i = document.getElementById('bg'); i.complete ? r() : i.onload = r; });
  buildScenes();
  buildIntro();
  buildCaptions();
  return true;
})();
</script>
</body>
</html>
